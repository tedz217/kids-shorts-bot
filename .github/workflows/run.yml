name: Auto Run Kids Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cai FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cai thu vien Python
        run: pip install -r requirements.txt

      - name: Chay tao video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Luu video xuat ra
        uses: actions/upload-artifact@v4
        with:
          name: completed-video
          path: kids_short.mp4
